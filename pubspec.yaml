name: cinespace
description: "CineSpace"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  provider: ^6.1.5+1
  json_annotation: ^4.11.0
  dio: ^5.9.2
  go_router: ^17.1.0

  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  flutter_intl: ^0.0.1
  firebase_storage: ^13.1.0
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  build_runner: ^2.12.2

flutter:

  uses-material-design: true
flutter_intl:
  main_locale: ru
  enabled: true


  assets:
    - assets/fonts/
    - assets/images/